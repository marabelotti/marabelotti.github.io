name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # First build can hit an intermittent asset-reference race: Analog builds the
      # client + SSR environments concurrently and vite-imagetools' emitted-asset IDs
      # leak between them (fails reliably on a cold Angular cache, i.e. every CI run).
      # The retry runs against a warm cache and is deterministic. Remove once
      # analogjs/analog serialises the environment builds.
      - run: npm run build || npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/analog/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
