<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mara Belotti</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Mara Belotti — mathematician and senior software consultant. Writing, travel photographs, and past research."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon-512.png" />
    <meta property="og:title" content="Mara Belotti" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://marabelotti.github.io/" />

      property="og:description"
      content="Mathematician and senior software consultant. Writing, travel photographs, and past research."
    />
    <meta property="og:image" content="https://marabelotti.github.io/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Set the theme before first paint so there is no flash.
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.dataset.theme = t;
          }
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <app-root></app-root>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
